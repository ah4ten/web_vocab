<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sổ Tay Từ Vựng Tiếng Anh</title>
    <style>
      :root {
        --primary-color: #6366f1;
        --primary-hover: #4f46e5;
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --text-main: #ffffff;
        --text-muted: #a1a1aa;
        --border-color: #333333;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        display: block; /* Đổi về block để không bị lỗi co giãn toàn trang */
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Sidebar - Quản lý chủ đề */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        height: 100vh;
        background-color: var(--card-bg);
        border-right: 1px solid var(--border-color);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 100;
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
        color: var(--primary-color);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .topic-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
      }

      .topic-item {
        padding: 12px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 500;
        color: var(--text-muted);
      }

      .topic-item:hover {
        background-color: #2d2d2d;
        color: var(--primary-color);
      }

      .topic-item.active {
        background-color: var(--primary-color);
        color: white;
      }

      /* Lớp phủ cho Mobile */
      .overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.6);
        z-index: 998;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      /* Khu vực hiển thị chính */
      .main-content {
        margin-left: 280px; /* Chừa chỗ cho sidebar trên máy tính */
        padding: 32px;
        min-height: 100vh;
        width: calc(100% - 280px);
      }

      /* =========================================
           HEADER CHÍNH - DÙNG CÁCH CỔ ĐIỂN SIÊU BỀN
           ========================================= */
      .header-actions {
        display: block; /* Không dùng flex nữa */
        width: 100%;
        margin-bottom: 32px;
        white-space: nowrap; /* Cấm xuống dòng cho toàn bộ khu vực này */
      }

      .menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 28px;
        color: var(--text-main);
        cursor: pointer;
        padding: 0;
        margin-right: 12px;
        vertical-align: middle; /* Căn giữa theo chiều dọc với chữ */
      }

      .header-actions h1 {
        display: inline-block; /* Xếp hàng ngang với nút */
        vertical-align: middle; /* Căn giữa theo chiều dọc với nút */
        font-size: 28px;
        color: var(--text-main);
        margin: 0;
        max-width: calc(100% - 50px); /* Chừa chỗ cho nút menu */
        overflow: hidden;
        text-overflow: ellipsis; /* Quá dài thì hiện dấu ... */
      }

      /* Form thêm từ vựng */
      .add-word-form {
        background-color: var(--card-bg);
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        margin-bottom: 32px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 16px;
        align-items: end;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .input-group label {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
      }

      input,
      select {
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
        background-color: transparent;
        color: var(--text-main);
        font-family: inherit;
        width: 100%;
      }

      input:focus,
      select:focus {
        border-color: var(--primary-color);
      }

      select {
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: calc(100% - 12px) center;
        background-size: 16px;
        padding-right: 36px;
      }

      select option {
        background-color: var(--card-bg);
        color: var(--text-main);
      }

      button {
        padding: 12px 24px;
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        height: 43px;
      }

      button:hover {
        background-color: var(--primary-hover);
      }

      /* Lưới hiển thị thẻ từ vựng */
      .vocab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
      }

      .vocab-card {
        background-color: var(--card-bg);
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s;
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .vocab-card:hover {
        transform: translateY(-4px);
      }

      .word-en {
        font-size: 24px;
        font-weight: bold;
        color: var(--primary-color);
        margin-bottom: 4px;
        padding-right: 30px;
      }

      .word-type {
        font-size: 13px;
        color: var(--text-muted);
        font-style: italic;
        margin-bottom: 12px;
        display: inline-block;
      }

      .word-vi {
        font-size: 16px;
        font-weight: 500;
      }

      /* Nút xóa được ghim chắc chắn */
      .delete-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        background: none;
        color: #ef4444;
        border: none;
        width: 32px;
        height: 32px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        padding: 0;
        border-radius: 50%;
      }

      .delete-btn:hover {
        background-color: rgba(239, 68, 68, 0.1);
      }

      /* =========================================
           THIẾT KẾ RESPONSIVE CHO ĐIỆN THOẠI
           ========================================= */
      @media (max-width: 768px) {
        .sidebar {
          transform: translateX(-100%);
          box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5);
          z-index: 999;
        }

        .sidebar.active {
          transform: translateX(0);
        }

        .overlay.active {
          display: block;
          opacity: 1;
        }

        .main-content {
          margin-left: 0;
          width: 100%;
          padding: 20px 16px;
        }

        .header-actions {
          margin-bottom: 24px;
        }

        .menu-toggle {
          display: inline-block; /* Bật hiển thị trên Mobile */
        }

        .header-actions h1 {
          font-size: 22px;
        }

        .add-word-form {
          grid-template-columns: 1fr;
          gap: 16px;
          padding: 20px;
        }

        button {
          width: 100%;
          margin-top: 8px;
        }

        .vocab-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="overlay" id="mobileOverlay" onclick="window.toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="logo">📚 Vocab Note</div>
      <div class="input-group" style="margin-bottom: 16px">
        <input
          type="text"
          id="newTopicInput"
          placeholder="Thêm chủ đề mới..."
        />
        <button
          onclick="window.addTopic()"
          style="margin-top: 8px; width: 100%"
        >
          + Thêm
        </button>
      </div>
      <ul class="topic-list" id="topicList"></ul>
    </aside>

    <main class="main-content">
      <div class="header-actions">
        <button class="menu-toggle" onclick="window.toggleMenu()">☰</button>
        <h1 id="currentTopicTitle">Đang tải dữ liệu...</h1>
      </div>

      <div class="add-word-form">
        <div class="input-group">
          <label>Từ tiếng Anh</label>
          <input type="text" id="wordInput" placeholder="VD: Application" />
        </div>

        <div class="input-group">
          <label>Loại từ</label>
          <select id="typeInput">
            <option value="Noun">Noun</option>
            <option value="Verb">Verb</option>
            <option value="Adj">Adj</option>
            <option value="Adv">Adv</option>
          </select>
        </div>

        <div class="input-group">
          <label>Nghĩa tiếng Việt</label>
          <input type="text" id="meaningInput" placeholder="VD: Ứng dụng" />
        </div>

        <button onclick="window.addWord()">Lưu Từ Vựng</button>
      </div>

      <div class="vocab-grid" id="vocabGrid"></div>
    </main>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
      import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        deleteDoc,
        doc,
        serverTimestamp,
        query,
        orderBy
      } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

      // ==========================================
      // ⚠️ COPY CẤU HÌNH FIREBASE CỦA BẠN VÀO ĐÂY
      // ==========================================
      const firebaseConfig = {
        apiKey: 'Dán-API-Key-Của-Bạn-Vào-Đây',
        authDomain: 'ten-du-an.firebaseapp.com',
        projectId: 'ten-du-an',
        storageBucket: 'ten-du-an.appspot.com',
        messagingSenderId: '123456789',
        appId: '1:123456789:web:abcdef'
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      let currentTopic = 'General';
      let topicsArray = ['General'];
      let allWords = [];

      window.toggleMenu = () => {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
      };

      const q = query(
        collection(db, 'vocabularies'),
        orderBy('createdAt', 'desc')
      );
      onSnapshot(q, (snapshot) => {
        allWords = [];
        let tempTopics = new Set(['General']);

        snapshot.forEach((doc) => {
          const wordData = { id: doc.id, ...doc.data() };
          allWords.push(wordData);
          if (wordData.topic) tempTopics.add(wordData.topic);
        });

        if (!tempTopics.has(currentTopic)) {
          tempTopics.add(currentTopic);
        }

        topicsArray = Array.from(tempTopics);
        renderTopics();
        renderVocab();
      });

      function renderTopics() {
        const topicList = document.getElementById('topicList');
        topicList.innerHTML = '';

        topicsArray.forEach((topic) => {
          const li = document.createElement('li');
          li.className = `topic-item ${topic === currentTopic ? 'active' : ''}`;
          li.innerText = topic;
          li.onclick = () => window.switchTopic(topic);
          topicList.appendChild(li);
        });
        document.getElementById('currentTopicTitle').innerText =
          `Chủ đề: ${currentTopic}`;
      }

      window.switchTopic = (topic) => {
        currentTopic = topic;
        renderTopics();
        renderVocab();
        if (window.innerWidth <= 768) {
          document.getElementById('sidebar').classList.remove('active');
          document.getElementById('mobileOverlay').classList.remove('active');
        }
      };

      window.addTopic = () => {
        const input = document.getElementById('newTopicInput');
        const newTopic = input.value.trim();

        if (newTopic && !topicsArray.includes(newTopic)) {
          topicsArray.push(newTopic);
          input.value = '';
          window.switchTopic(newTopic);
        }
      };

      window.addWord = async () => {
        const word = document.getElementById('wordInput').value.trim();
        const type = document.getElementById('typeInput').value;
        const meaning = document.getElementById('meaningInput').value.trim();

        if (!word || !meaning) {
          alert('Vui lòng nhập Từ tiếng Anh và Nghĩa tiếng Việt!');
          return;
        }

        try {
          await addDoc(collection(db, 'vocabularies'), {
            word: word,
            type: type,
            meaning: meaning,
            topic: currentTopic,
            createdAt: serverTimestamp()
          });

          document.getElementById('wordInput').value = '';
          document.getElementById('typeInput').value = 'Noun';
          document.getElementById('meaningInput').value = '';
        } catch (error) {
          console.error('Lỗi thêm từ vựng: ', error);
          alert('Đã xảy ra lỗi khi lưu dữ liệu!');
        }
      };

      window.deleteWord = async (docId) => {
        if (confirm('Bạn có chắc chắn muốn xóa từ này?')) {
          try {
            await deleteDoc(doc(db, 'vocabularies', docId));
          } catch (error) {
            console.error('Lỗi xóa từ vựng: ', error);
          }
        }
      };

      function renderVocab() {
        const grid = document.getElementById('vocabGrid');
        grid.innerHTML = '';

        const currentWords = allWords.filter(
          (item) => item.topic === currentTopic
        );

        if (currentWords.length === 0) {
          grid.innerHTML =
            '<p style="color: var(--text-muted); grid-column: 1 / -1;">Chưa có từ vựng nào trong chủ đề này.</p>';
          return;
        }

        currentWords.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'vocab-card';
          card.innerHTML = `
                    <button class="delete-btn" onclick="window.deleteWord('${item.id}')">✕</button>
                    <div class="word-en">${item.word}</div>
                    <div class="word-type">(${item.type})</div>
                    <div class="word-vi">${item.meaning}</div>
                `;
          grid.appendChild(card);
        });
      }
    </script>
  </body>
</html>
