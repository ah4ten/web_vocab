<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Sổ Tay Từ Vựng Tiếng Anh</title>
    <style>
      :root {
        --primary-color: #6366f1;
        --primary-hover: #4f46e5;
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --text-main: #ffffff;
        --text-muted: #a1a1aa;
        --border-color: #333333;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        max-width: 100vw;
        background-color: var(--bg-color);
        color: var(--text-main);
        overflow-x: hidden;
      }

      /* ==================== 
           SIDEBAR (THANH MENU)
           ==================== */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        height: 100vh;
        background-color: var(--card-bg);
        border-right: 1px solid var(--border-color);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 1000;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
        color: var(--primary-color);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .topic-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
      }

      .topic-item {
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
        font-weight: 500;
        color: var(--text-muted);
        display: flex;
        justify-content: space-between; /* Đẩy chữ và nút X ra 2 bên */
        align-items: center;
      }

      .topic-item:hover {
        background-color: #2d2d2d;
        color: var(--primary-color);
      }

      .topic-item.active {
        background-color: var(--primary-color);
        color: white;
      }

      /* Nút xóa chủ đề */
      .delete-topic-btn {
        background: none;
        border: none;
        color: #ef4444;
        font-size: 16px;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.7;
      }

      .delete-topic-btn:hover {
        opacity: 1;
      }

      .active .delete-topic-btn {
        color: white;
      }

      /* LỚP PHỦ MÀN HÌNH TỐI (MOBILE) */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        z-index: 998;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease;
      }

      .overlay.active {
        opacity: 1;
        visibility: visible;
      }

      /* ==================== 
           KHU VỰC CHÍNH 
           ==================== */
      .main-content {
        margin-left: 280px;
        padding: 32px;
        min-height: 100vh;
        width: auto;
      }

      /* KHU VỰC HEADER - FIX HIỂN THỊ CỨNG BẰNG CALC */
      .header-actions {
        display: flex;
        align-items: center;
        width: 100%;
        margin-bottom: 32px;
      }

      .menu-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 28px;
        color: var(--text-main);
        cursor: pointer;
        padding: 0;
      }

      .header-actions h1 {
        display: block;
        font-size: 28px;
        color: var(--text-main);
        margin: 0;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ==================== 
           FORM NHẬP LIỆU 
           ==================== */
      .add-word-form {
        background-color: var(--card-bg);
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        margin-bottom: 32px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr auto;
        gap: 16px;
        align-items: end;
        width: 100%;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }

      .input-group label {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
      }

      input,
      select {
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        background-color: transparent;
        color: var(--text-main);
        width: 100%;
      }

      input:focus,
      select:focus {
        border-color: var(--primary-color);
      }

      select {
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: calc(100% - 12px) center;
        background-size: 16px;
        padding-right: 36px;
      }

      select option {
        background-color: var(--card-bg);
        color: var(--text-main);
      }

      button.primary-btn {
        padding: 12px 24px;
        background-color: var(--primary-color);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        height: 43px;
      }

      /* ==================== 
           THẺ TỪ VỰNG 
           ==================== */
      .vocab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
        width: 100%;
      }

      .vocab-card {
        background-color: var(--card-bg);
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .word-en {
        font-size: 24px;
        font-weight: bold;
        color: var(--primary-color);
        margin-bottom: 4px;
        padding-right: 36px;
        word-break: break-word;
      }

      .word-type {
        font-size: 13px;
        color: var(--text-muted);
        font-style: italic;
        margin-bottom: 12px;
      }

      .word-vi {
        font-size: 16px;
        font-weight: 500;
        word-break: break-word;
      }

      .delete-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        background: none;
        color: #ef4444;
        border: none;
        width: 32px;
        height: 32px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        padding: 0;
        border-radius: 50%;
        cursor: pointer;
      }

      /* =========================================
           THIẾT KẾ RESPONSIVE CHO ĐIỆN THOẠI
           ========================================= */
      @media (max-width: 768px) {
        .sidebar {
          transform: translateX(-100%);
        }

        .sidebar.active {
          transform: translateX(0);
        }

        .main-content {
          margin-left: 0;
          padding: 20px 16px;
          width: 100%;
        }

        .header-actions {
          margin-bottom: 24px;
        }

        .menu-toggle {
          display: block;
          width: 36px; /* Đặt độ rộng cố định cho nút */
          flex-shrink: 0;
        }

        .header-actions h1 {
          width: calc(
            100% - 48px
          ); /* Trừ đi độ rộng của nút 3 gạch và khoảng cách */
          margin-left: 12px; /* Khoảng cách giữa nút và chữ */
          font-size: 22px;
        }

        .add-word-form {
          grid-template-columns: 1fr;
          gap: 16px;
          padding: 20px;
        }

        button.primary-btn {
          width: 100%;
          margin-top: 8px;
        }

        .vocab-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="overlay" id="mobileOverlay" onclick="window.toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="logo">📚 Vocab Note</div>
      <div class="input-group" style="margin-bottom: 16px">
        <input
          type="text"
          id="newTopicInput"
          placeholder="Thêm chủ đề mới..."
        />
        <button
          class="primary-btn"
          onclick="window.addTopic()"
          style="margin-top: 8px; width: 100%"
        >
          + Thêm
        </button>
      </div>
      <ul class="topic-list" id="topicList"></ul>
    </aside>

    <main class="main-content">
      <div class="header-actions">
        <button class="menu-toggle" onclick="window.toggleMenu()">☰</button>
        <h1 id="currentTopicTitle">Đang tải dữ liệu...</h1>
      </div>

      <div class="add-word-form">
        <div class="input-group">
          <label>Từ tiếng Anh</label>
          <input type="text" id="wordInput" placeholder="VD: Application" />
        </div>

        <div class="input-group">
          <label>Loại từ</label>
          <select id="typeInput">
            <option value="Noun">Noun</option>
            <option value="Verb">Verb</option>
            <option value="Adj">Adj</option>
            <option value="Adv">Adv</option>
          </select>
        </div>

        <div class="input-group">
          <label>Nghĩa tiếng Việt</label>
          <input type="text" id="meaningInput" placeholder="VD: Ứng dụng" />
        </div>

        <button class="primary-btn" onclick="window.addWord()">
          Lưu Từ Vựng
        </button>
      </div>

      <div class="vocab-grid" id="vocabGrid"></div>
    </main>

    <script type="module">
      // Import thư viện Firebase trực tiếp từ link CDN (dành cho web thuần)
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
      import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        deleteDoc,
        doc,
        serverTimestamp,
        query,
        orderBy
      } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

      // ==========================================
      // ĐÂY LÀ CẤU HÌNH CỦA RIÊNG BẠN (Đã được dán sẵn)
      // ==========================================
      const firebaseConfig = {
        apiKey: 'AIzaSyD7VYvgSGd3wYRPWT2oZ1dlT-WOQ45LNRU',
        authDomain: 'vocabnote-d6541.firebaseapp.com',
        projectId: 'vocabnote-d6541',
        storageBucket: 'vocabnote-d6541.firebasestorage.app',
        messagingSenderId: '642568306619',
        appId: '1:642568306619:web:73ee53fbec9cd979eb0e9e',
        measurementId: 'G-R533ZKN85L'
      };

      // Khởi tạo Firebase App và Database
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Biến toàn cục
      let currentTopic = 'General';
      let topicsArray = ['General'];
      let allWords = [];

      // Toggle Sidebar trên Mobile
      window.toggleMenu = () => {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('mobileOverlay').classList.toggle('active');
      };

      // Lắng nghe dữ liệu Database theo thời gian thực
      const q = query(
        collection(db, 'vocabularies'),
        orderBy('createdAt', 'desc')
      );
      onSnapshot(q, (snapshot) => {
        allWords = [];
        let tempTopics = new Set(['General']);

        snapshot.forEach((doc) => {
          const wordData = { id: doc.id, ...doc.data() };
          allWords.push(wordData);
          if (wordData.topic) tempTopics.add(wordData.topic);
        });

        if (!tempTopics.has(currentTopic)) {
          tempTopics.add(currentTopic);
        }

        topicsArray = Array.from(tempTopics);
        renderTopics();
        renderVocab();
      });

      // Hàm Render Danh sách chủ đề
      function renderTopics() {
        const topicList = document.getElementById('topicList');
        topicList.innerHTML = '';

        topicsArray.forEach((topic) => {
          const li = document.createElement('li');
          li.className = `topic-item ${topic === currentTopic ? 'active' : ''}`;
          li.onclick = () => window.switchTopic(topic);

          // Thẻ bọc tên chủ đề
          const span = document.createElement('span');
          span.innerText = topic;
          li.appendChild(span);

          // Nút Xóa chủ đề (Chỉ hiện khi không phải General)
          if (topic !== 'General') {
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-topic-btn';
            deleteBtn.innerHTML = '✕';
            deleteBtn.onclick = (e) => window.deleteTopic(topic, e);
            li.appendChild(deleteBtn);
          }

          topicList.appendChild(li);
        });
        document.getElementById('currentTopicTitle').innerText =
          `Chủ đề: ${currentTopic}`;
      }

      window.switchTopic = (topic) => {
        currentTopic = topic;
        renderTopics();
        renderVocab();
        if (window.innerWidth <= 768) {
          document.getElementById('sidebar').classList.remove('active');
          document.getElementById('mobileOverlay').classList.remove('active');
        }
      };

      window.addTopic = () => {
        const input = document.getElementById('newTopicInput');
        const newTopic = input.value.trim();

        if (newTopic && !topicsArray.includes(newTopic)) {
          topicsArray.push(newTopic);
          input.value = '';
          window.switchTopic(newTopic);
        }
      };

      // Hàm xóa toàn bộ chủ đề
      window.deleteTopic = async (topicToDelete, event) => {
        event.stopPropagation(); // Ngăn click lan ra ngoài làm đổi chủ đề

        if (topicToDelete === 'General') {
          alert('Bạn không thể xóa chủ đề mặc định!');
          return;
        }

        const confirmMsg = `Bạn có chắc chắn muốn xóa chủ đề "${topicToDelete}" không?\nToàn bộ từ vựng trong chủ đề này sẽ bị xóa vĩnh viễn.`;
        if (confirm(confirmMsg)) {
          try {
            const wordsToDelete = allWords.filter(
              (w) => w.topic === topicToDelete
            );
            for (const word of wordsToDelete) {
              await deleteDoc(doc(db, 'vocabularies', word.id));
            }
            topicsArray = topicsArray.filter((t) => t !== topicToDelete);
            if (currentTopic === topicToDelete) {
              window.switchTopic('General');
            } else {
              renderTopics();
            }
          } catch (error) {
            console.error('Lỗi xóa chủ đề: ', error);
            alert('Có lỗi xảy ra khi xóa chủ đề. Vui lòng thử lại!');
          }
        }
      };

      // Hàm thêm từ vựng
      window.addWord = async () => {
        const word = document.getElementById('wordInput').value.trim();
        const type = document.getElementById('typeInput').value;
        const meaning = document.getElementById('meaningInput').value.trim();

        if (!word || !meaning) {
          alert('Vui lòng nhập Từ tiếng Anh và Nghĩa tiếng Việt!');
          return;
        }

        try {
          await addDoc(collection(db, 'vocabularies'), {
            word: word,
            type: type,
            meaning: meaning,
            topic: currentTopic,
            createdAt: serverTimestamp()
          });

          document.getElementById('wordInput').value = '';
          document.getElementById('typeInput').value = 'Noun';
          document.getElementById('meaningInput').value = '';
        } catch (error) {
          console.error('Lỗi thêm từ vựng: ', error);
          alert(
            'Đã xảy ra lỗi khi lưu dữ liệu! Bạn hãy kiểm tra xem Database đã chọn Test Mode chưa nhé.'
          );
        }
      };

      // Hàm xóa từ vựng
      window.deleteWord = async (docId) => {
        if (confirm('Bạn có chắc chắn muốn xóa từ này?')) {
          try {
            await deleteDoc(doc(db, 'vocabularies', docId));
          } catch (error) {
            console.error('Lỗi xóa từ vựng: ', error);
          }
        }
      };

      // Hàm hiển thị lưới từ vựng
      function renderVocab() {
        const grid = document.getElementById('vocabGrid');
        grid.innerHTML = '';

        const currentWords = allWords.filter(
          (item) => item.topic === currentTopic
        );

        if (currentWords.length === 0) {
          grid.innerHTML =
            '<p style="color: var(--text-muted); grid-column: 1 / -1;">Chưa có từ vựng nào trong chủ đề này.</p>';
          return;
        }

        currentWords.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'vocab-card';
          card.innerHTML = `
                    <button class="delete-btn" onclick="window.deleteWord('${item.id}')">✕</button>
                    <div class="word-en">${item.word}</div>
                    <div class="word-type">(${item.type})</div>
                    <div class="word-vi">${item.meaning}</div>
                `;
          grid.appendChild(card);
        });
      }
    </script>
  </body>
</html>
